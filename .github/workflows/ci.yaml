name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Security audit (runs in parallel with test matrix)
  # ─────────────────────────────────────────────
  lint-and-audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # @v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # @v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────
  # Job 2: Test matrix (Node 18/20/22 × Ubuntu/Windows)
  # ─────────────────────────────────────────────
  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false   # let all matrix cells finish even if one fails
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # @v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # @v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # @v4
        with:
          name: test-results-node${{ matrix.node-version }}-${{ matrix.os }}
          path: |
            coverage/
            junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Build check (runs after both jobs above pass)
  # ─────────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-audit, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # @v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # @v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package integrity (dry-run pack)
        run: npm pack --dry-run

  # ─────────────────────────────────────────────
  # Job 4: CI gate — single stable status check for branch protection
  # ─────────────────────────────────────────────
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [build-check]
    if: always()

    steps:
      - name: Check all upstream jobs succeeded
        run: |
          if [[ "${{ needs.build-check.result }}" != "success" ]]; then
            echo "❌ CI failed — build-check result: ${{ needs.build-check.result }}"
            exit 1
          fi
          echo "✅ All CI jobs passed"